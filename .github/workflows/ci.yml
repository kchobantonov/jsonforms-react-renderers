name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fallow:
    name: Fallow changed-code audit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Audit introduced findings
        run: pnpm run fallow:audit --base "${{ github.event.pull_request.base.sha }}" --format github-summary >> "$GITHUB_STEP_SUMMARY"

  build:
    # Playwright 1.58.1 does not provide Chromium or install-deps for Ubuntu 26.04.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Changesets base branch available
        if: github.event_name == 'pull_request'
        run: git show-ref --verify --quiet refs/heads/master || git branch master origin/master

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check formatting and lint
        run: vp check

      - name: Test release tooling
        run: vp run test:release

      - name: Build workspace
        run: vp run build

      - name: Validate release tarballs
        run: node scripts/pack-release.mjs

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Test packed web components
        run: vp run test:packed

      - name: Test standalone web components
        run: pnpm run test:standalone

      - name: Run public package tests with coverage
        run: pnpm run test-cov

      - name: Run demo support tests
        run: pnpm --filter jsonforms-react-demo-common test

      - name: Merge coverage reports
        run: pnpm run merge-report

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/lcov.info
            packages/*/coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Publish coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info
          format: lcov

      # Build and deploy only after all checks and tests succeed.
      - name: Setup GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Build GitHub Pages website
        if: github.event_name == 'push'
        run: vp run build:pages
        env:
          GITHUB_PAGES: 'true'

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/jsonforms-react-examples-app/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
