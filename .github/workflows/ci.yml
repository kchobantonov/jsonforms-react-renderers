name: Node.js CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make Changesets base branch available
        if: github.event_name == 'pull_request'
        run: git show-ref --verify --quiet refs/heads/master || git branch master origin/master
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - name: Checkout local specification dependency
        uses: actions/checkout@v4
        with:
          repository: kchobantonov/jsonforms-extended-spec
          path: .spec-source
      - name: Place specification beside the renderer workspace
        run: mv .spec-source ../jsonforms-extended-spec
      - name: Build specification package
        run: pnpm --dir ../jsonforms-extended-spec install --frozen-lockfile && pnpm --dir ../jsonforms-extended-spec build
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Check formatting and lint
        run: vp check
      - name: Test release tooling
        run: vp run test:release
      - name: Build
        run: vp run build
      - name: Validate release tarballs
        run: node scripts/pack-release.mjs
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Test packed web components
        run: vp run test:packed
      - name: Run tests
        run: vp test run
