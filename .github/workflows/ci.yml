name: Node.js CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make Changesets base branch available
        if: github.event_name == 'pull_request'
        run: git show-ref --verify --quiet refs/heads/master || git branch master origin/master
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - name: Checkout local specification dependency
        uses: actions/checkout@v4
        with:
          repository: kchobantonov/jsonforms-extended-spec
          path: .spec-source
      - name: Place specification beside the renderer workspace
        run: mv .spec-source ../jsonforms-extended-spec
      - name: Build specification package
        run: pnpm --dir ../jsonforms-extended-spec install --frozen-lockfile && pnpm --dir ../jsonforms-extended-spec build
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm check-format
      - name: Test release tooling
        run: pnpm test:release
      - name: Build
        run: pnpm build
      - name: Validate release tarballs
        run: node scripts/pack-release.mjs
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Test packed web components
        run: pnpm test:packed
      - name: Run tests
        run: pnpm --workspace-concurrency=1 -r --if-present test
