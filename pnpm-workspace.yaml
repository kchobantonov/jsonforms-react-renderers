packages:
  - 'packages/*'
  - 'apps/*'

# Shared dependency resolutions, including Vite+ toolchain aliases.
overrides:
  ajv-formats: ^3.0.1
  ajv@>=8: 8.20.0
  enzyme>cheerio: 1.0.0-rc.12
  lodash: ^4.18.1
  dayjs: 1.11.13
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

allowBuilds:
  '@parcel/watcher': set this to true or false
  core-js: set this to true or false
  esbuild: true
  nx: set this to true or false

# pnpm 10+ prompts before purging node_modules and aborts when there is no TTY,
# which is how CI and any non-interactive install run it.
confirmModulesPurge: false
catalog:
  '@jsonforms/core': 3.9.0-alpha.4
  '@jsonforms/react': 3.9.0-alpha.4
  '@jsonforms/examples': 3.9.0-alpha.4
  '@ant-design/icons': 6.3.2
  '@base-ui/react': ^1.8.0
  '@emotion/react': ^11.5.0
  '@emotion/styled': ^11.3.0
  '@monaco-editor/react': ^4.6.0
  '@radix-ui/react-avatar': ^1.2.6
  '@radix-ui/react-checkbox': 1.3.11
  '@radix-ui/react-dialog': 1.1.23
  '@radix-ui/react-popover': 1.1.23
  '@radix-ui/react-select': 2.3.7
  '@radix-ui/react-slot': 1.2.4
  '@radix-ui/react-tabs': 1.1.21
  '@radix-ui/react-tooltip': ^1.2.16
  '@types/node': ^22.0.0
  '@types/react': ^18.3.23
  '@types/react-dom': ^18.3.7
  '@vitejs/plugin-react': ^5.2.0
  ag-grid-community: 36.1.0
  ag-grid-react: 36.1.0
  ajv: ^8.20.0
  antd: 6.6.5
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  dayjs: ^1.11.11
  jsdom: ^22.0.0
  lodash: ^4.18.1
  lucide-react: 1.37.0
  radix-ui: ^1.6.7
  react: ^18.3.1
  react-day-picker: 10.0.1
  react-dom: ^18.3.1
  react-resizable-panels: ^4.12.3
  rimraf: ^3.0.2
  tailwind-merge: 3.6.0
  tslib: ^2.5.0
  typedoc: ~0.25.3
  typescript: ~5.9.3
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0
  '@vitest/coverage-v8': 5.0.5
catalogs:
  peers:
    '@ant-design/icons': ^6.3.2
    antd: ^6.6.5
    react: ^18.0.0 || ^19.0.0
    react-dom: ^18.0.0 || ^19.0.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
