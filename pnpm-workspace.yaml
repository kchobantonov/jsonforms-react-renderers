packages:
  - 'packages/*'
  - 'apps/*'

# Shared dependency resolutions, including Vite+ toolchain aliases.
overrides:
  ajv-formats: ^3.0.1
  ajv@>=8: 8.20.0
  enzyme>cheerio: 1.0.0-rc.12
  lodash: ^4.18.1
  dayjs: 1.11.13
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

allowBuilds:
  '@parcel/watcher': set this to true or false
  core-js: set this to true or false
  esbuild: true
  nx: set this to true or false

# pnpm 10+ prompts before purging node_modules and aborts when there is no TTY,
# which is how CI and any non-interactive install run it.
confirmModulesPurge: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0
  '@vitest/coverage-v8': 5.0.5
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
